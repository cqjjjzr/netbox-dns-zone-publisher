[package]
name = "netbox-dns-zone-publisher"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "NetBox DNS snapshot publisher with atomic SCP deployment"
license = "MIT"
readme = "README.adoc"
repository = "https://github.com/cqjjjzr/netbox-dns-zone-publisher"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
domain = { version = "0.12.3", features = ["zonefile"] }
duct = { version = "1.1.2", features = ["timeout"] }
hex = "0.4"
log = "0.4"
env_logger = "0.11"
time = { version = "0.3", features = ["formatting"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
similar = "3.2.0"
tempfile = "3"
toml = "1.1.8"
url = { version = "2", features = ["serde"] }

[profile.release]
lto = "thin"
strip = true

[package.metadata.deb]
maintainer = "chariri <w@chariri.moe>"
copyright = "2026 chariri <w@chariri.moe>"
license-file = ["LICENSE", "0"]
changelog = "packaging/debian/changelog"
section = "net"
priority = "optional"
depends = "$auto, libgcc-s1 (>= 4.2), bind9-utils, openssh-client, ca-certificates, adduser, init-system-helpers (>= 1.54~)"
extended-description = "Collect DNS records from NetBox DNS, retain normalized snapshots, optionally sign zones with DNSSEC, and deploy verified zone files locally or over SSH. Includes a systemd timer for periodic collection and publication."
maintainer-scripts = "packaging/debian"
assets = [
  ["target/release/netbox-dns-zone-publisher", "usr/bin/", "755"],
  ["README.adoc", "usr/share/doc/netbox-dns-zone-publisher/", "644"],
  ["docs/*.adoc", "usr/share/doc/netbox-dns-zone-publisher/docs/", "644"],
  ["examples/*", "usr/share/doc/netbox-dns-zone-publisher/examples/", "644"],
  ["packaging/debian/netbox-dns-zone-publisher.1", "usr/share/man/man1/", "644"],
  ["THIRD_PARTY_NOTICES.md", "usr/share/doc/netbox-dns-zone-publisher/", "644"],
]

[package.metadata.deb.systemd-units]
enable = false
start = false
