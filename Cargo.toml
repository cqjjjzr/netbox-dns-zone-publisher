[package]
name = "netbox-dns-zone-publisher"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "NetBox DNS snapshot publisher with atomic SCP deployment"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
domain = { version = "0.12.2", features = ["zonefile"] }
duct = { version = "1.1.2", features = ["timeout"] }
hex = "0.4"
log = "0.4"
env_logger = "0.11"
time = { version = "0.3", features = ["formatting"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
similar = "3.2.0"
tempfile = "3"
toml = "1.1.6"
url = { version = "2", features = ["serde"] }

[profile.release]
lto = "thin"
strip = true
